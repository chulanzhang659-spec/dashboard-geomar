wmWR8YYTtaHbXgfaK8j+sCWgE8a9d3W1XTkEY9HZyjpw=="}</script><script>(async function () {
  const envelope = JSON.parse(document.getElementById('encrypted-page').textContent);
  const prefix = 'six-brand-key:' + envelope.salt;
  const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const b64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));
  const stored = () => { try { return sessionStorage.getItem(prefix); } catch { return null; } };
  const remember = key => { try { sessionStorage.setItem(prefix, key); } catch {} };
  const forget = () => { try { sessionStorage.removeItem(prefix); } catch {} };
  async function keyFor(password) {
    const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
    return b64(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:bytes(envelope.salt),iterations:600000}, material, 256));
  }
  async function decrypt(e, rawKey) {
    if(e.algorithm !== 'AES-256-GCM' || e.salt !== envelope.salt || e.iterations !== 600000) throw Error('Unsupported envelope');
    const key = await crypto.subtle.importKey('raw', bytes(rawKey), 'AES-GCM', false, ['decrypt']);
    return crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(e.iv)}, key, bytes(e.ciphertext));
  }
  async function unlock(rawKey) {
    const html = new TextDecoder('utf-8', {fatal:true}).decode(await decrypt(envelope, rawKey));
    remember(rawKey);
    // Replace the current document directly: preserve native URLs and avoid a giant iframe.
    document.open(); document.write(html); document.close();
    document.addEventListener('click', async event => {
      const a = event.target.closest('a[download]');
      if (!a) return;
      const url = new URL(a.href, location.href);
      if (url.origin !== location.origin || !url.pathname.includes('/downloads/')) return;
      event.preventDefault();
      try {
        const response = await fetch(url);
        if (!response.ok) throw Error('download');
        const data = await decrypt(await response.json(), rawKey);
        const blob = URL.createObjectURL(new Blob([data], {type:'application/octet-stream'}));
        const link = document.createElement('a'); link.href=blob;link.download=a.download || 'download';link.click();
        setTimeout(()=>URL.revokeObjectURL(blob),60000);
      } catch { alert('下载解密失败，请刷新页面后重新输入密码。'); }
    }, true);
    const lock=document.createElement('button');lock.textContent='锁定看板';lock.id='lock-dashboard';
    lock.style.cssText='position:fixed;right:14px;bottom:14px;z-index:9999;border:1px solid #d1d5db;border-radius:8px;background:white;padding:8px 14px;color:#334155;cursor:pointer';
    lock.onclick=()=>{forget();location.reload()};document.body.appendChild(lock);
  }
  const form=document.getElementById('unlock-form'), error=document.getElementById('unlock-error'), input=document.getElementById('site-password');
  if(!crypto.subtle){error.textContent='当前浏览器不支持安全解密，请使用支持 HTTPS / Web Crypto 的浏览器。';return;}
  let failures=0,lockedUntil=0;
  form.addEventListener('submit', async e=>{
    e.preventDefault();if(Date.now()<lockedUntil){error.textContent='请稍后再试';return;}
    const button=form.querySelector('button');button.disabled=true;error.textContent='正在解锁…';
    try {await unlock(await keyFor(input.value));input.value='';}
    catch {forget();error.textContent='密码不正确，或文件已损坏';if(++failures>=5){lockedUntil=Date.now()+30000;failures=0;}button.disabled=false;}
  });
  const cached=stored();if(cached){try{await unlock(cached);}catch{forget();error.textContent='请输入密码解锁新版本';}}
})();
</script></body></html>
